<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lições Jovens — Resgate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #171335;
      --void-2: #241f52;
      --bg: #f7f5ff;
      --card: #ffffff;
      --ink: #1c1735;
      --ink-soft: #5a5480;
      --violet: #6c4ce0;
      --violet-light: #c9bbff;
      --pink: #ff5d8f;
      --lime: #a6e22e;
      --lime-dark: #4d7a12;
      --sun: #ffc857;
      --teal: #2fd6c8;
      --coral: #ff8a5c;
      --red: #ef4763;
      --day1: #6c4ce0; --day2: #ff5d8f; --day3: #2fd6c8; --day4: #ffc857; --day5: #ff8a5c; --day6: #8e6cff; --day7: #22b8a6;
    }

    [data-theme="dark"] {
      --void: #0f0d1e;
      --void-2: #1a1630;
      --bg: #0f0d1e;
      --card: #1a1630;
      --ink: #e8e4f0;
      --ink-soft: #a89fc0;
      --violet: #8b5cf6;
      --violet-light: #d8caff;
      --pink: #ff6ca3;
      --lime: #bef264;
      --lime-dark: #a3d500;
      --teal: #2dd4bf;
      --coral: #ff9d72;
      --red: #ff6b6b;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      line-height: 1.6;
      padding-bottom: 80px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 8% 12%, rgba(108, 76, 224, 0.10), transparent 40%),
        radial-gradient(circle at 92% 20%, rgba(255, 93, 143, 0.10), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(47, 214, 200, 0.08), transparent 45%);
    }

    .page { display: none; position: relative; z-index: 1; }
    .page.active { display: block; }

    /* ===== HERO ===== */
    header.hero {
      background: linear-gradient(135deg, var(--void) 0%, var(--void-2) 45%, #4a2f9e 100%);
      color: #fff;
      padding: 48px 24px 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header.hero::before {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 93, 143, 0.55), transparent 70%);
      top: -140px;
      right: -100px;
      filter: blur(10px);
    }

    header.hero::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(47, 214, 200, 0.4), transparent 70%);
      bottom: -120px;
      left: -80px;
      filter: blur(10px);
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 12.5px;
      color: var(--lime);
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
      display: inline-block;
      background: rgba(166, 226, 46, 0.12);
      padding: 6px 14px;
      border-radius: 100px;
    }

    h1.title {
      font-family: 'Unbounded', sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 6.5vw, 3.8rem);
      margin: 0 0 10px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
      background: linear-gradient(90deg, #fff 0%, var(--violet-light) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1rem;
      color: #c9c4f0;
      max-width: 520px;
      margin: 0 auto 24px;
      position: relative;
      z-index: 1;
    }

    .keyword-seal {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 1;
      background: linear-gradient(90deg, var(--violet), var(--pink));
      color: #fff;
      padding: 10px 22px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      box-shadow: 0 8px 24px -8px rgba(255, 93, 143, 0.6);
      margin-bottom: 28px;
    }

    .keyword-seal b {
      color: #fff;
      font-size: 14px;
      font-family: 'Unbounded', sans-serif;
    }

    /* ===== DASHBOARD ===== */
    .dashboard {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(247, 245, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #e8e2ff;
      padding: 14px 16px 12px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .dashboard {
      background: rgba(26, 22, 48, 0.9);
      border-bottom-color: #2a2540;
    }

    .dash-inner { max-width: 760px; margin: 0 auto; }

    .pills {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      color: white;
      padding: 10px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--violet), var(--pink));
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 72px;
      box-shadow: 0 4px 12px -4px rgba(108, 76, 224, 0.4);
    }

    .pill:hover { transform: translateY(-2px); box-shadow: 0 6px 16px -4px rgba(108, 76, 224, 0.6); }
    .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); }

    main { max-width: 760px; margin: 0 auto; padding: 48px 20px 100px; position: relative; z-index: 1; }

    /* ===== DAY CARD ===== */
    .day {
      background: var(--card);
      border-radius: 26px;
      padding: 40px 32px 36px;
      margin-bottom: 56px;
      position: relative;
      box-shadow: 0 2px 0 rgba(28, 23, 53, 0.04), 0 24px 48px -30px rgba(28, 23, 53, 0.35);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    [data-theme="dark"] .day {
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3), 0 24px 48px -30px rgba(0, 0, 0, 0.6);
    }

    .day::after {
      content: "";
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 6px;
      border-radius: 0 0 8px 8px;
    }

    .day:nth-of-type(1)::after { background: var(--day1); }
    .day:nth-of-type(2)::after { background: var(--day2); }
    .day:nth-of-type(3)::after { background: var(--day3); }
    .day:nth-of-type(4)::after { background: var(--day4); }
    .day:nth-of-type(5)::after { background: var(--day5); }
    .day:nth-of-type(6)::after { background: var(--day6); }
    .day:nth-of-type(7)::after { background: var(--day7); }

    .day::before {
      content: attr(data-letter);
      position: absolute;
      top: -20px;
      left: 32px;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      color: #fff;
      font-family: 'Unbounded', sans-serif;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px -6px rgba(28, 23, 53, 0.4);
      transform: rotate(-6deg);
    }

    .day:nth-of-type(1)::before { background: var(--day1); }
    .day:nth-of-type(2)::before { background: var(--day2); }
    .day:nth-of-type(3)::before { background: var(--day3); }
    .day:nth-of-type(4)::before { background: var(--day4); }
    .day:nth-of-type(5)::before { background: var(--day5); }
    .day:nth-of-type(6)::before { background: var(--day6); }
    .day:nth-of-type(7)::before { background: var(--day7); }

    .day-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--pink);
      margin: 10px 0 6px;
      font-weight: 700;
    }

    .day h2 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      margin: 0 0 18px;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .keyideas {
      background: #eef7e0;
      border: 2px solid #d4edb0;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      margin-bottom: 14px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .keyideas {
      background: #2a3520;
      border-color: #3d5030;
    }

    .keyideas b {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--lime-dark);
      margin-bottom: 6px;
    }

    .day p {
      margin: 0 0 16px;
      color: var(--ink);
    }

    /* Destaque de palavras-chave em <b> */
    .day p b, .day div b {
      font-weight: 700;
      color: var(--violet);
    }

    [data-theme="dark"] .day p b,
    [data-theme="dark"] .day div b {
      color: var(--violet-light);
    }

    /* ===== BOTÃO MARCAR COMO LIDO ===== */
    .mark-read-btn {
      background: linear-gradient(90deg, var(--lime), #7dd321);
      color: var(--lime-dark);
      border: none;
      padding: 12px 24px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px -4px rgba(166, 226, 46, 0.5);
      transition: all 0.3s ease;
    }

    .mark-read-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(166, 226, 46, 0.7);
    }

    .mark-read-btn.marked {
      opacity: 0.6;
      cursor: default;
    }

    /* ===== REFLEXIVAS ===== */
    .reflect {
      background: #f3ffe0;
      border-left: 4px solid var(--lime);
      padding: 20px;
      border-radius: 12px;
      margin: 24px 0;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .reflect {
      background: #2a3520;
      border-left-color: #7dd321;
    }

    .reflect h3 {
      margin: 0 0 12px;
      color: var(--lime-dark);
      font-size: 1rem;
    }

    .reflect ol {
      margin: 0;
      padding-left: 20px;
    }

    .reflect li {
      margin-bottom: 8px;
      color: var(--ink);
    }

    /* ===== MAPA MENTAL RADIAL ===== */
    .mental-map {
      margin: 32px 0;
      padding: 24px;
      background: rgba(108, 76, 224, 0.05);
      border-radius: 20px;
      border: 2px solid rgba(108, 76, 224, 0.15);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .mental-map {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.25);
    }

    .mental-map h3 {
      text-align: center;
      color: var(--violet);
      margin-top: 0;
      font-family: 'Unbounded', sans-serif;
      font-weight: 700;
    }

    .mental-map svg {
      width: 100%;
      height: auto;
      max-width: 400px;
      display: block;
      margin: 0 auto;
      color: var(--violet);
    }

    /* ===== QUIZ ===== */
    .quiz {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 2px dashed #e8e2ff;
    }

    [data-theme="dark"] .quiz {
      border-top-color: #2a2540;
    }

    .quiz h3 {
      font-family: 'Unbounded', sans-serif;
      color: var(--violet);
      margin: 0 0 12px;
    }

    .quiz-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--violet);
      margin-bottom: 16px;
      font-weight: 700;
    }

    .q-block {
      background: #f7f5ff;
      border-left: 4px solid var(--violet);
      padding: 16px;
      margin: 12px 0;
      border-radius: 12px;
      transition: background 0.3s ease;
    }

    [data-theme="dark"] .q-block {
      background: #1f1a35;
      border-left-color: #8b5cf6;
    }

    .diff {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .diff-facil { background: #e0ffe0; color: var(--lime-dark); }
    .diff-inter { background: #fffce0; color: #8b7500; }
    .diff-avancada { background: #ffe0e0; color: var(--red); }

    [data-theme="dark"] .diff-facil { background: #2a4a2a; }
    [data-theme="dark"] .diff-inter { background: #4a4a2a; }
    [data-theme="dark"] .diff-avancada { background: #4a2a2a; }

    .q-text {
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .options button {
      background: white;
      border: 2px solid #e8e2ff;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
      color: var(--ink);
    }

    [data-theme="dark"] .options button {
      background: #1f1a35;
      border-color: #2a2540;
      color: var(--ink);
    }

    .options button:hover {
      border-color: var(--violet);
      background: #f7f5ff;
    }

    [data-theme="dark"] .options button:hover {
      background: #2a2540;
    }

    .options button.selected {
      background: var(--violet);
      color: white;
      border-color: var(--violet);
    }

    .gabarito {
      background: #f3ffe0;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--lime-dark);
      font-weight: 700;
      margin-top: 8px;
      display: none;
      transition: background 0.3s ease;
    }

    [data-theme="dark"] .gabarito {
      background: #2a3520;
      color: #7dd321;
    }

    .gabarito.show {
      display: block;
    }

    .reveal-btn {
      background: linear-gradient(90deg, var(--violet), var(--pink));
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 12px;
      box-shadow: 0 4px 12px -4px rgba(255, 93, 143, 0.4);
      transition: all 0.3s ease;
    }

    .reveal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px rgba(255, 93, 143, 0.6);
    }

    /* ===== V/F ===== */
    .tf {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed #e8e2ff;
    }

    [data-theme="dark"] .tf {
      border-top-color: #2a2540;
    }

    .tf h3 {
      font-family: 'Unbounded', sans-serif;
      color: var(--violet);
      margin: 0 0 16px;
    }

    .tf-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f5ff;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      border-left: 4px solid var(--teal);
      transition: background 0.3s ease;
    }

    [data-theme="dark"] .tf-item {
      background: #1f1a35;
      border-left-color: #2dd4bf;
    }

    .tf-btns {
      display: flex;
      gap: 8px;
    }

    .tf-btns button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #e8e2ff;
      background: white;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
      color: var(--ink);
    }

    [data-theme="dark"] .tf-btns button {
      background: #2a2540;
      border-color: #3a3550;
      color: var(--ink);
    }

    .tf-btns button:hover {
      transform: scale(1.1);
    }

    .tf-btns button[data-v="V"] {
      color: var(--lime-dark);
    }

    .tf-btns button[data-v="F"] {
      color: var(--red);
    }

    .tf-btns button.selected {
      background: var(--teal);
      color: white;
      border-color: var(--teal);
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 2px solid #e8e2ff;
      display: flex;
      justify-content: space-around;
      z-index: 100;
      padding: 8px 0;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    [data-theme="dark"] .bottom-nav {
      background: rgba(26, 22, 48, 0.95);
      border-top-color: #2a2540;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px 0;
      cursor: pointer;
      color: var(--ink-soft);
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
      border-top: 3px solid transparent;
    }

    .nav-item:hover { color: var(--violet); }
    .nav-item.active { color: var(--violet); border-top-color: var(--violet); }

    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .config-page {
      padding: 32px 20px;
    }

    .config-item {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 0 rgba(28, 23, 53, 0.04), 0 12px 28px -10px rgba(28, 23, 53, 0.2);
      transition: all 0.3s ease;
    }

    .config-item h3 {
      margin: 0;
      color: var(--ink);
      font-family: 'Unbounded', sans-serif;
    }

    .toggle-switch {
      position: relative;
      width: 60px;
      height: 32px;
      background: #e8e2ff;
      border-radius: 100px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .toggle-switch.active {
      background: var(--lime);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s ease;
    }

    [data-theme="dark"] .toggle-switch::after {
      background: #1a1630;
    }

    .toggle-switch.active::after {
      left: 30px;
    }

    .footer-text {
      text-align: center;
      margin-top: 40px;
      opacity: 0.6;
      font-size: 12px;
    }
  </style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="page-home">
  <header class="hero">
    <div class="eyebrow">Lição Jovens</div>
    <h1 class="title">Permaneçam em Mim</h1>
    <p class="subtitle">Tema: Dependência de Cristo</p>
    <div class="keyword-seal">Palavra-chave: <b>DEPENDÊNCIA</b></div>
  </header>

  <nav class="dashboard">
    <div class="dash-inner">
      <div class="pills" id="pills-container"></div>
    </div>
  </nav>

  <main id="dias-container"></main>
</div>

<!-- CONFIG -->
<div class="page" id="page-config">
  <main class="config-page">
    <h2 style="font-family: 'Unbounded', sans-serif; color: var(--violet); font-size: 1.8rem; margin-top: 32px;">Configurações</h2>

    <div class="config-item">
      <h3>Modo Escuro</h3>
      <div class="toggle-switch" id="dark-mode-toggle"></div>
    </div>

    <div class="footer-text">
      <p>Lições Jovens v1.0 — Resgate (Q3 2026)</p>
      <p>© Escola Sabatina Jovem</p>
    </div>
  </main>

      },
      {
        id: "sab",
        letra: "S",
        data: "Sábado · 25 de julho · Comunidade",
        titulo: "Mais do que Perto",
        keyideas: "Privilégios ligados a uma condição · Distância causada pelo pecado · Reconciliação · Chamados de filhos",
        verses: ["João 1:12", "Romanos 3:23", "2 Coríntios 5:19"],

          {dif: "Fácil", q: "Segundo a lição, qual palavra grega significa tanto \"cortar\" quanto \"levantar\"?", op: ["A) Airo", "B) Karpos", "C) Poiesis", "D) Metanoia"], r: "A"},
          {dif: "Fácil", q: "Em quais capítulos de João Jesus passa tempo encorajando os discípulos antes da cruz?", op: ["A) 1-5", "B) 13-17", "C) 18-21", "D) 6-10"], r: "B"},

          {dif: "Intermediária", q: "Segundo a lição, por que o mundo odeia os discípulos de Cristo?", op: ["A) Porque são fracos", "B) Porque foram escolhidos por Jesus", "C) Porque são ricos", "D) Porque não creem"], r: "B"},

        vf: [{q: "A videira, diferente das árvores comuns, se sustenta sozinha.", r: "F"}, {q: "Jesus amou os discípulos com o mesmo amor com que o Pai O amou.", r: "V"}, {q: "Somos chamados filhos de Deus apenas quando conseguimos ser perfeitos.", r: "F"}]

  // ===== MAPA MENTAL RADIAL (SVG) =====
  function criarMapaMental() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 340 340');
    svg.style.maxWidth = '100%';
    svg.style.height = 'auto';

    const colors = ['#6c4ce0', '#ff5d8f', '#2fd6c8', '#ffc857', '#ff8a5c', '#8e6cff', '#22b8a6'];
    const dias = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];

    // Centro
    const centerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    centerCircle.setAttribute('cx', '170');
    centerCircle.setAttribute('cy', '170');
    centerCircle.setAttribute('r', '35');
    centerCircle.setAttribute('fill', 'var(--violet)');
    centerCircle.setAttribute('opacity', '0.15');
    centerCircle.setAttribute('stroke', 'var(--violet)');
    centerCircle.setAttribute('stroke-width', '2');
    svg.appendChild(centerCircle);

    const centerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    centerText.setAttribute('x', '170');
    centerText.setAttribute('y', '168');
    centerText.setAttribute('text-anchor', 'middle');
    centerText.setAttribute('font-weight', '700');
    centerText.setAttribute('font-size', '13');
    centerText.setAttribute('fill', 'var(--ink)');
    centerText.textContent = 'PERMANEÇAM';
    svg.appendChild(centerText);

    const centerText2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    centerText2.setAttribute('x', '170');
    centerText2.setAttribute('y', '183');
    centerText2.setAttribute('text-anchor', 'middle');
    centerText2.setAttribute('font-weight', '700');
    centerText2.setAttribute('font-size', '13');
    centerText2.setAttribute('fill', 'var(--ink)');
    centerText2.textContent = 'EM MIM';
    svg.appendChild(centerText2);

    // 7 dias em círculo
    for (let i = 0; i < 7; i++) {
      const angle = (i * 360 / 7 - 90) * (Math.PI / 180);
      const x = 170 + 90 * Math.cos(angle);
      const y = 170 + 90 * Math.sin(angle);

      // Linha do centro
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', '170');
      line.setAttribute('y1', '170');
      line.setAttribute('x2', x);
      line.setAttribute('y2', y);
      line.setAttribute('stroke', 'var(--violet)');
      line.setAttribute('stroke-width', '1.5');
      line.setAttribute('opacity', '0.3');
      svg.appendChild(line);

      // Círculo do dia
      const dayCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dayCircle.setAttribute('cx', x);
      dayCircle.setAttribute('cy', y);
      dayCircle.setAttribute('r', '20');
      dayCircle.setAttribute('fill', colors[i]);
      dayCircle.setAttribute('opacity', '0.2');
      dayCircle.setAttribute('stroke', colors[i]);
      dayCircle.setAttribute('stroke-width', '2');
      svg.appendChild(dayCircle);

      // Texto do dia
      const dayText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      dayText.setAttribute('x', x);
      dayText.setAttribute('y', y + 6);
      dayText.setAttribute('text-anchor', 'middle');
      dayText.setAttribute('font-weight', '700');
      dayText.setAttribute('font-size', '11');
      dayText.setAttribute('fill', 'var(--ink)');
      dayText.textContent = dias[i];
      svg.appendChild(dayText);
    }

    return svg;
  }

  // ===== RENDERIZAR CONTEÚDO =====
  function renderizarLicao(licao) {
    const container = document.getElementById('dias-container');
    const pillsContainer = document.getElementById('pills-container');

    container.innerHTML = '';
    pillsContainer.innerHTML = '';

    // Pills
    licao.dias.forEach((dia, idx) => {
      const pill = document.createElement('a');
      pill.className = 'pill';
      pill.href = `#dia-${dia.id}`;
      pill.innerHTML = `<span style="font-size: 14px; font-weight: 800;">${dia.letra}</span><span>${dia.titulo.split(' ')[0]}</span>`;
      pillsContainer.appendChild(pill);
    });

    // Dias
    licao.dias.forEach((dia, idx) => {
      const dayEl = document.createElement('article');
      dayEl.className = 'day';
      dayEl.setAttribute('data-letter', dia.letra);
      dayEl.id = `dia-${dia.id}`;

      let conteudoHTML = `
        <div class="day-date">${dia.data}</div>
        <h2>${dia.titulo}</h2>
        <div class="keyideas"><b>Palavras-chave:</b> ${dia.keyideas}</div>
      `;

      conteudoHTML += `
        <div style="margin: 24px 0; line-height: 1.8; color: var(--ink);">
          ${dia.conteudo.replace(/\n/g, '<br><br>')}
        </div>

        <div class="reflect">
          <h3>🤔 Diálogo Aberto</h3>
          <ol>
      `;

      dia.reflexivas.forEach(r => {
        conteudoHTML += `<li>${r}</li>`;
      });

      conteudoHTML += `
          </ol>
        </div>

        <button class="mark-read-btn" onclick="marcarComoLido(this)">✓ Marcar como Lido</button>
      `;

      if (idx === 6) {
        // Sábado: adicionar mapa mental
        conteudoHTML = conteudoHTML.replace('</button>', `</button>
          <div class="mental-map">
            <h3>📊 Mapa Mental da Semana</h3>
        `) + `</div>`;
      }

      if (dia.quiz.length > 0) {
        conteudoHTML += `<div class="quiz">
          <h3>📝 Revisão da Semana</h3>
          <div class="quiz-timer">⏱️ Tempo: <span id="timer-${idx}">00:00</span></div>`;

        dia.quiz.forEach((q, qIdx) => {
          const diffClass = q.dif.includes('Fácil') ? 'diff-facil' : q.dif.includes('Intermediária') ? 'diff-inter' : 'diff-avancada';
          conteudoHTML += `
            <div class="q-block">
              <span class="diff ${diffClass}">${q.dif}</span>
              <p class="q-text">Q${qIdx + 1}. ${q.q}</p>
              <div class="options">
          `;

          q.op.forEach((opt, oIdx) => {
            conteudoHTML += `
              <button onclick="responderQuiz(this, '${q.r}')" class="q-option">
                ${opt}
              </button>
            `;
          });

          conteudoHTML += `
              </div>
              <div class="gabarito" id="gab-${idx}-${qIdx}">✓ Resposta: ${q.r}</div>
            </div>
          `;
        });

        conteudoHTML += `
          <button class="reveal-btn" onclick="revelarGabarito(${idx})">Ver Gabarito</button>
        </div>`;
      }

      if (dia.vf.length > 0) {
        conteudoHTML += `<div class="tf">
          <h3>✓/✗ Verdadeiro ou Falso?</h3>`;

        dia.vf.forEach((item, vfIdx) => {
          conteudoHTML += `
            <div class="tf-item">
              <span>${item.q}</span>
              <div class="tf-btns">
                <button data-v="V" onclick="responderVF(this, '${item.r}')">V</button>
                <button data-v="F" onclick="responderVF(this, '${item.r}')">F</button>
              </div>
            </div>
          `;
        });

        conteudoHTML += `</div>`;
      }

      dayEl.innerHTML = conteudoHTML;

      // Adicionar mapa mental para sábado
      if (idx === 6) {
        const mentalMapDiv = dayEl.querySelector('.mental-map');
        if (mentalMapDiv) {
          const mapa = criarMapaMental();
          mentalMapDiv.appendChild(mapa);
        }
      }

      container.appendChild(dayEl);
    });
  }

  // ===== FUNÇÕES DE INTERAÇÃO =====
  function marcarComoLido(btn) {
    btn.classList.add('marked');
    btn.textContent = '✓ Lido';
    btn.disabled = true;
    localStorage.setItem(`lido-${btn.closest('.day').id}`, 'true');
  }

  function responderQuiz(btn, respostaCorreta) {
    const parent = btn.closest('.q-block');
    const botoes = parent.querySelectorAll('.q-option');
    botoes.forEach(b => b.disabled = true);

    if (btn.textContent.includes(respostaCorreta)) {
      btn.style.background = '#a6e22e';
      btn.style.color = '#3a5000';
    } else {
      btn.style.background = '#ef4763';
      btn.style.color = 'white';
      botoes.forEach(b => {
        if (b.textContent.includes(respostaCorreta)) {
          b.style.background = '#a6e22e';
          b.style.color = '#3a5000';
        }
      });
    }
  }

  function responderVF(btn, respostaCorreta) {
    const parent = btn.closest('.tf-item');
    const botoes = parent.querySelectorAll('.tf-btns button');
    botoes.forEach(b => b.disabled = true);

    const escolhido = btn.getAttribute('data-v');
    if (escolhido === respostaCorreta) {
      btn.style.background = '#a6e22e';
      btn.style.color = 'white';
    } else {
      btn.style.background = '#ef4763';
      btn.style.color = 'white';
      botoes.forEach(b => {
        if (b.getAttribute('data-v') === respostaCorreta) {
          b.style.background = '#a6e22e';
          b.style.color = 'white';
        }
      });
    }
  }

  function revelarGabarito(idx) {
    const blocos = document.querySelectorAll(`#gab-${idx}-0, #gab-${idx}-1, #gab-${idx}-2, #gab-${idx}-3, #gab-${idx}-4, #gab-${idx}-5, #gab-${idx}-6, #gab-${idx}-7, #gab-${idx}-8, #gab-${idx}-9`);
    blocos.forEach(b => b.classList.toggle('show'));
  }

  // ===== DARK MODE =====
  function initDarkMode() {
    const toggle = document.getElementById('dark-mode-toggle');
    const root = document.documentElement;
    const saved = localStorage.getItem('darkMode');

    if (saved === 'true') {
      root.setAttribute('data-theme', 'dark');
      toggle.classList.add('active');
    }

    toggle.addEventListener('click', () => {
      const isDark = root.getAttribute('data-theme') === 'dark';
      if (isDark) {
        root.removeAttribute('data-theme');
        localStorage.setItem('darkMode', 'false');
        toggle.classList.remove('active');
      } else {
        root.setAttribute('data-theme', 'dark');
        localStorage.setItem('darkMode', 'true');
        toggle.classList.add('active');
      }
    });
  }

  // ===== NAVEGAÇÃO =====
  function initNav() {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

        item.classList.add('active');
        const page = item.getAttribute('data-page');
        document.getElementById(`page-${page}`).classList.add('active');
      });
    });
  }

  // ===== INIT =====
  document.addEventListener('DOMContentLoaded', () => {
    renderizarLicao(licao4);
    initNav();
    initDarkMode();
  });
</script>
